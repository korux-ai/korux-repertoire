name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate packages
        run: ./scripts/validate_all.sh
      - name: Build zip
        run: ./scripts/package_release.sh "${GITHUB_REF_NAME}"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/korux-repertoire-${{ github.ref_name }}.zip
            dist/SHA256SUMS
